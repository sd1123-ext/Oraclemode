[project]
name = "testv3"
version = "0.1.0"
description = "testv3 using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.102.0,<1.0.0"
]

[project.scripts]
testv3 = "testv3.main:run"
run_crew = "testv3.main:run"
train = "testv3.main:train"
replay = "testv3.main:replay"
test = "testv3.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
